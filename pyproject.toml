[project]
name = "pyresonitelink"
version = "0.4.0"
description = "Python bindings for ResoniteLink"
readme = "README.md"
authors = [
    { name = "Robert Baruch", email = "robert.c.baruch@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.4.1",
    "pillow>=13.0.0",
    "textual>=7.1.0",
    "trimesh>=5.1.1",
    "websockets>=16.0.0",
]

[project.scripts]
resonite-tree = "pyresonitelink.cli.tree:main"
resonite-dumptree = "pyresonitelink.cli.dumptree:main"
resonite-gencode = "pyresonitelink.cli.gencode:main"
resonite-wikidocs = "pyresonitelink.cli.wikidocs:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "build>=1.4.0",
    "coverage>=7.13.0",
    "pyrefly>=1.4.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "textual-dev>=1.8.0",
    "types-jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyrefly]
# Only the package is checked. The tests aren't type-checked.
project-includes = ["src"]
